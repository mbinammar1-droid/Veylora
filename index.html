<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منظّم المذاكرة الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== 1) الألوان والمتغيرات: عدّل هنا لتغيير شكل التطبيق كله ===== */
:root{--bg:#f3f4f7;--card:#fff;--ink:#1b2a4a;--mut:#6b7794;--line:#e4e7ee;--navy:#1b2a4a;--teal:#14a39a;--pur:#7c6bd6;--red:#d4543f;--sh:0 2px 14px rgba(27,42,74,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#162238;--ink:#e8edf7;--mut:#9aa8c4;--line:#243350;--sh:none;--teal:#2fc4b9;--pur:#9a8cf0}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#162238;--ink:#e8edf7;--mut:#9aa8c4;--line:#243350;--sh:none;--teal:#2fc4b9;--pur:#9a8cf0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;line-height:1.7}
/* ===== 2) التخطيط ===== */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--card);border-inline-end:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:1.15rem;padding:4px 10px 18px;color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand{color:var(--ink)}}
nav{display:grid;gap:4px}
nav button{display:flex;align-items:center;gap:10px;text-align:start;background:none;border:0;color:var(--mut);padding:11px 12px;border-radius:12px;font:inherit;cursor:pointer;min-height:44px}
nav button.on{background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal);font-weight:700}
main{padding:26px 24px 40px;max-width:1000px;width:100%}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.05rem;margin:0 0 12px}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--sh);border:1px solid var(--line);margin-bottom:16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.stat{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);border:1px solid var(--line);border-top:4px solid var(--c)}
.stat b{display:block;font-size:1.7rem;margin-top:2px}.stat span{color:var(--mut);font-size:.9rem}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--pur));border-radius:99px;transition:width .4s}
/* ===== 3) النماذج والأزرار ===== */
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{display:grid;gap:4px;font-size:.85rem;color:var(--mut)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px;width:100%}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 16px;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pur);outline-offset:2px}
.pri{background:var(--teal);color:#fff;font-weight:500}.gh{background:var(--line);color:var(--ink)}
.sm{min-height:36px;padding:5px 12px;font-size:.85rem;background:var(--line);color:var(--ink)}.sm.d{color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
/* المهام */
.grp{margin-top:14px;font-weight:700;display:flex;gap:8px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.task{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.task input[type=checkbox]{width:22px;min-height:22px;height:22px;accent-color:var(--teal)}
.task .t{flex:1;min-width:0}.task.dn .t b{text-decoration:line-through;color:var(--mut)}
.t small{color:var(--mut);display:block}
.tag{font-size:.75rem;padding:2px 9px;border-radius:99px;color:#fff}
.tag.high{background:var(--red)}.tag.med{background:#e08a3c}.tag.low{background:var(--teal)}
.empty{text-align:center;color:var(--mut);padding:24px;border:2px dashed var(--line);border-radius:14px}
/* الجدول */
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.col h3{font-size:.9rem;margin:0 0 8px;color:var(--mut)}.col.today h3{color:var(--teal)}
.blk{background:color-mix(in srgb,var(--c) 14%,var(--card));border-inline-start:5px solid var(--c);border-radius:12px;padding:9px 11px;margin-bottom:8px;font-size:.9rem}
.blk small{display:block;color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chips button{background:var(--line);color:var(--ink);white-space:nowrap}.chips button.on{background:var(--pur);color:#fff}
/* المؤقت */
.tm{text-align:center}
.ringw{position:relative;width:min(280px,72vw);margin:10px auto}
.ringw svg{width:100%;transform:rotate(-90deg)}
.ringw .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:3.2rem;font-weight:700;direction:ltr;font-variant-numeric:tabular-nums}
/* الرسوم */
.bars{display:flex;gap:8px;align-items:flex-end}
.bc{flex:1;display:grid;gap:4px;text-align:center;font-size:.75rem;color:var(--mut)}
.bt{height:130px;display:flex;align-items:flex-end;background:var(--bg);border-radius:8px;overflow:hidden}
.bt i{display:block;width:100%;background:var(--pur);opacity:.55;border-radius:8px 8px 0 0;transition:height .4s}.bt i.hl{background:var(--teal);opacity:1}
/* ===== 4) الجوال: القائمة تنتقل للأسفل ===== */
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;inset:auto 0 0 0;height:auto;top:auto;z-index:5;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-inline-end:0}
 .brand{display:none}nav{grid-template-columns:repeat(6,1fr);gap:2px}
 nav button{flex-direction:column;gap:0;font-size:.68rem;padding:6px 2px;text-align:center}
 main{padding:18px 14px 100px}.filters{grid-template-columns:1fr}
}
.top{display:flex;justify-content:flex-end;margin-bottom:10px}
.langs{display:inline-flex;background:var(--line);border-radius:12px;padding:3px}
.langs button{min-height:36px;padding:4px 14px;background:none;color:var(--mut);border-radius:9px}
.langs button.on{background:var(--card);color:var(--teal);font-weight:700}
.wel{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.wbox{max-width:560px;margin:0 auto}
.logo{font-size:2.6rem;width:76px;height:76px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(135deg,var(--teal),var(--pur));margin-bottom:12px}
.how{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.how span{font-size:1.4rem}
.tp{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;text-align:start}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside><div class="brand" id="bn"></div><nav id="nav"></nav></aside>
  <main id="main"></main>
</div>
<div id="wel"></div>
<script>
/* ===== 1) النصوص: كل نص له مفتاح بالعربية ثم الإنجليزية ===== */
const D={
brand:['منظّم المذاكرة الذكي','Smart Study Organizer'],
nHome:['الرئيسية','Home'],nSchedule:['الجدول','Schedule'],nTasks:['المهام','Tasks'],nTimer:['المؤقّت','Timer'],nStats:['الإحصائيات','Stats'],nSet:['الإعدادات','Settings'],
hello:['أهلًا بك! مستعد لإنجاز أهدافك؟','Welcome! Ready to achieve your goals?'],glance:['هذه نظرة سريعة على يومك.','Here is a quick look at your day.'],
todayTasks:['مهام اليوم','Today\'s tasks'],doneTasks:['المهام المنجزة','Completed tasks'],studyTime:['وقت المذاكرة','Study time'],rate:['نسبة الإنجاز','Completion rate'],
goalLine:['الهدف اليومي: {0} من {1}','Daily goal: {0} of {1}'],upcoming:['أقرب المهام','Upcoming tasks'],
noPending:['لا توجد مهام متبقية. أضف مهمة من صفحة المهام.','No pending tasks. Add one from the Tasks page.'],
todaySess:['جلسات اليوم','Today\'s sessions'],noSessToday:['لا جلسات اليوم. أضف جلسة من الجدول.','No sessions today. Add one from the Schedule.'],noDue:['بلا موعد','No due date'],
tasksT:['المهام','Tasks'],tasksSub:['أضف مهامك ونظّمها حسب المادة والأولوية.','Add your tasks and organize them by subject and priority.'],
taskName:['اسم المهمة','Task name'],subject:['المادة','Subject'],subjPh:['مثال: الفيزياء','e.g. Physics'],due:['الموعد','Due date'],priority:['الأولوية','Priority'],
high:['عالية','High'],med:['متوسطة','Medium'],low:['منخفضة','Low'],addTask:['إضافة المهمة','Add task'],saveEdit:['حفظ التعديل','Save changes'],cancel:['إلغاء','Cancel'],
remaining:['المتبقية: {0} • المنجزة: {1}','Remaining: {0} • Done: {1}'],allStatus:['كل الحالات','All statuses'],pending:['المتبقية','Remaining'],doneF:['المنجزة','Done'],
allPrio:['كل الأولويات','All priorities'],allSubj:['كل المواد','All subjects'],edit:['تعديل','Edit'],del:['حذف','Delete'],general:['عام','General'],checkLbl:['إنجاز','Mark done'],
noMatch:['لا مهام تطابق الفلترة.','No tasks match the filters.'],noTasks:['لا توجد مهام بعد. أضف أول مهمة من النموذج أعلاه.','No tasks yet. Add your first one using the form above.'],
schedT:['جدول المذاكرة','Study schedule'],schedSub:['جلسات أسبوعية متكررة، بلون لكل مادة.','Repeating weekly sessions, one color per subject.'],
day:['اليوم','Day'],start:['البداية','Start'],end:['النهاية','End'],addSess:['إضافة الجلسة','Add session'],timeErr:['وقت النهاية يجب أن يكون بعد وقت البداية.','End time must be after the start time.'],
daily:['يومي','Daily'],weekly:['أسبوعي','Weekly'],
timerT:['مؤقّت التركيز','Focus timer'],timerSub:['ركّز، ثم استرح. كل جلسة مكتملة تُسجَّل في إحصائياتك.','Focus, then rest. Every completed session is logged in your statistics.'],
study:['مذاكرة','Study'],brk:['استراحة','Break'],breakNow:['وقت الاستراحة','Break time'],startB:['بدء','Start'],pauseB:['إيقاف مؤقت','Pause'],resumeB:['استئناف','Resume'],resetB:['إعادة ضبط','Reset'],
sessDone:['جلسات اليوم المكتملة: {0} • {1}','Sessions completed today: {0} • {1}'],editTime:['تعديل الوقت','Edit time'],studyMin:['مدة المذاكرة (دقيقة)','Study length (minutes)'],breakMin:['مدة الاستراحة (دقيقة)','Break length (minutes)'],
save:['حفظ','Save'],savedNow:['تم الحفظ. المدد الجديدة مطبّقة على المؤقّت.','Saved. The new lengths are applied to the timer.'],
savedLater:['تم الحفظ. الجلسة الجارية لن تتغير؛ ستُطبَّق المدد الجديدة عند إعادة الضبط أو الجلسة التالية.','Saved. The running session is unchanged; the new lengths apply on reset or the next session.'],
statsT:['الإحصائيات','Statistics'],statsSub:['تُحسب من نشاطك الفعلي داخل التطبيق.','Calculated from your actual activity in the app.'],
totalFocus:['إجمالي وقت التركيز','Total focus time'],goalPct:['إنجاز هدف اليوم','Today\'s goal progress'],vsY:['اليوم مقابل أمس','Today vs. yesterday'],
hoursWeek:['ساعات المذاكرة خلال الأسبوع','Study hours this week'],tasksDaily:['المهام المنجزة يوميًا','Tasks completed per day'],
noLog:['ابدأ جلسة تركيز لتظهر البيانات هنا.','Complete a focus session to see data here.'],noDone:['أنجز مهمة لتظهر المقارنة هنا.','Complete a task to see the comparison here.'],
setT:['الإعدادات','Settings'],setSub:['خصّص التطبيق ليناسبك.','Customize the app to suit you.'],yourName:['اسمك','Your name'],goalMin:['الهدف اليومي (دقيقة)','Daily goal (minutes)'],
saveSet:['حفظ الإعدادات','Save settings'],savedSet:['تم حفظ الإعدادات.','Settings saved.'],demoT:['البيانات التجريبية','Sample data'],
rmDemo:['حذف البيانات التجريبية','Delete sample data'],addDemo:['استعادة البيانات التجريبية','Restore sample data'],showIntro:['عرض الشرح مرة أخرى','Show the intro again'],langT:['اللغة','Language'],
welcome:['مرحبًا بك','Welcome'],welDesc:['تطبيق يساعدك على تنظيم مذاكرتك وإنجاز مهامك يومًا بعد يوم، في مكان واحد.','An app that helps you organize your studying and finish your tasks, day by day, in one place.'],
howT:['كيف تستخدمه؟','How to use it'],
h1:['المهام: أضف ما عليك إنجازه مع المادة والموعد والأولوية، ثم علّم ما أنجزته.','Tasks: add what you need to do with a subject, due date and priority, then tick what you finish.'],
h2:['الجدول: خطّط لجلسات مذاكرة أسبوعية بوقت البداية والنهاية، ولكل مادة لونها.','Schedule: plan weekly study sessions with start and end times; each subject gets its own color.'],
h3:['المؤقّت: ذاكر بتركيز لمدة محددة ثم استرح، وتُسجَّل جلساتك تلقائيًا.','Timer: focus for a set time, then take a break; your sessions are logged automatically.'],
h4:['الإحصائيات: تابع ساعات مذاكرتك ومهامك المنجزة وقارن بين الأيام.','Statistics: track your study hours and finished tasks, and compare your days.'],
startNow:['ابدأ الآن','Get started']};
/* مهام وجلسات تجريبية: [عنوان عربي، مادة عربية، عنوان إنجليزي، مادة إنجليزية] */
const DT=[['حل تمارين الفصل الثالث','الرياضيات','Solve chapter 3 exercises','Math'],['مراجعة قواعد النحو','اللغة العربية','Review grammar rules','Arabic'],['تلخيص درس الخلية','الأحياء','Summarize the cell lesson','Biology'],['تحضير تقرير الكيمياء','الكيمياء','Prepare the chemistry report','Chemistry']];
const AR_DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],EN_DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

/* ===== 2) أدوات مساعدة ===== */
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>dstr(new Date());
const off=n=>{const d=new Date();d.setDate(d.getDate()+n);return d};
const ORDER=[6,0,1,2,3,4,5],PAL=['#14a39a','#7c6bd6','#e08a3c','#3b82c4','#d4568a','#6a9e3f','#b8872e'];
const col=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%997;return PAL[h%PAL.length]};
const EN=()=>S.settings.lang==='en';
const tr=(k,...a)=>{let s=(D[k]||[k,k])[EN()?1:0];a.forEach((v,i)=>s=s.replace('{'+i+'}',v));return s};
const num=n=>Number(n).toLocaleString(EN()?'en-US':'ar-EG'),dn=d=>EN()?EN_DAYS[d]:AR_DAYS[d];
const fm=m=>{const u=EN()?['h','m']:['س','د'];return m<60?num(m)+' '+u[1]:num(Math.floor(m/60))+' '+u[0]+(m%60?' '+num(m%60)+' '+u[1]:'')};
const title=x=>x.dk!=null?DT[x.dk][EN()?2:0]:x.title;
const rawSub=x=>x.dk!=null?DT[x.dk][EN()?3:1]:(x.subject==='عام'?'':x.subject||'');
const sub=x=>rawSub(x)||tr('general'),cn=x=>x.dk!=null?DT[x.dk][1]:x.subject;

/* ===== 3) البيانات والحفظ ===== */
const KEY='msm-v1';
function demo(){const t=today(),d=new Date().getDay(),mk=(a)=>Object.assign({id:uid(),demo:1},a),T_=(i,a)=>mk(Object.assign({dk:i,title:DT[i][0],subject:DT[i][1]},a));
 return{tasks:[T_(0,{due:t,prio:'high',done:false}),T_(1,{due:t,prio:'med',done:true,doneAt:t}),T_(2,{due:dstr(off(1)),prio:'low',done:false}),T_(3,{due:dstr(off(2)),prio:'high',done:false})],
 blocks:[T_(0,{day:d,start:'16:00',end:'17:00'}),T_(2,{day:(d+1)%7,start:'18:00',end:'19:00'}),T_(3,{day:(d+2)%7,start:'17:00',end:'18:30'})],
 log:[50,75,30,100,60,45].map((m,i)=>mk({date:dstr(off(-(i+1))),min:m}))}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.tasks&&x.blocks&&x.log){x.settings=Object.assign({name:'',focus:25,brk:5,goal:120,lang:'ar'},x.settings);
 x.tasks.forEach(t=>{if(t.demo&&t.dk==null){const i=DT.findIndex(d=>d[0]===t.title);if(i>=0)t.dk=i}});
 x.blocks.forEach(b=>{if(b.demo&&b.dk==null){const i=DT.findIndex(d=>d[1]===b.subject);if(i>=0)b.dk=i}});return x}}catch(e){}
 return Object.assign({settings:{name:'',focus:25,brk:5,goal:120,lang:'ar'},seen:false},demo())}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),view='home',filt={st:'all',pr:'all',sub:'all'},editT=null,editB=null,sv='week',sd=new Date().getDay(),tpOpen=false,tpMsg='';

/* ===== 4) الإحصائيات ===== */
const minOn=d=>S.log.filter(l=>l.date===d).reduce((a,l)=>a+l.min,0),doneOn=d=>S.tasks.filter(t=>t.done&&t.doneAt===d).length;
const pct=()=>S.tasks.length?Math.round(S.tasks.filter(t=>t.done).length/S.tasks.length*100):0,week=()=>[6,5,4,3,2,1,0].map(i=>off(-i));

/* ===== 5) التنقل واللغة ===== */
const NAV=[['home','nHome','🏠'],['schedule','nSchedule','🗓️'],['tasks','nTasks','✅'],['timer','nTimer','⏱️'],['stats','nStats','📊'],['settings','nSet','⚙️']];
function go(v){view=v;render();scrollTo(0,0)}
function setLang(l){S.settings.lang=l;filt.sub='all';save();render()}
const langBar=()=>`<div class="langs" role="group" aria-label="${tr('langT')}"><button class="${EN()?'':'on'}" onclick="setLang('ar')">العربية</button><button class="${EN()?'on':''}" onclick="setLang('en')">English</button></div>`;
function render(){
 const en=EN();document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';document.title=tr('brand');
 $('#bn').textContent='📚 '+tr('brand');
 $('#nav').innerHTML=NAV.map(n=>`<button class="${n[0]===view?'on':''}" onclick="go('${n[0]}')"><span>${n[2]}</span>${tr(n[1])}</button>`).join('');
 $('#main').innerHTML=`<div class="top">${langBar()}</div>`+V[view]();
 $('#wel').innerHTML=S.seen?'':welcome();
 if(view==='tasks')listTasks();if(view==='timer')upd();
}
const stat=(l,v,c)=>`<div class="stat" style="--c:${c}"><span>${l}</span><b>${v}</b></div>`;
const PRS=['high','med','low'];
const welcome=()=>`<div class="wel"><div class="wbox"><div class="top">${langBar()}</div><div class="logo">📚</div><h1>${tr('brand')}</h1><h2>${tr('welcome')}</h2><p class="sub">${tr('welDesc')}</p>
 <div class="card"><h2>${tr('howT')}</h2>${[['✅','h1'],['🗓️','h2'],['⏱️','h3'],['📊','h4']].map(h=>`<div class="how"><span>${h[0]}</span><div>${tr(h[1])}</div></div>`).join('')}</div>
 <button class="pri" style="width:100%" onclick="startNow()">${tr('startNow')}</button></div></div>`;
function startNow(){S.seen=true;save();view='home';render();scrollTo(0,0)}
function showIntro(){S.seen=false;save();render()}

/* ===== 6) الصفحات ===== */
const V={
home(){const d=today(),tt=S.tasks.filter(x=>x.due===d),m=minOn(d),g=Math.min(100,Math.round(m/S.settings.goal*100)||0);
 const up=S.tasks.filter(x=>!x.done).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).slice(0,4),bl=S.blocks.filter(b=>b.day===new Date().getDay()).sort((a,b)=>a.start.localeCompare(b.start));
 return`<h1>${tr('hello')}</h1><p class="sub">${S.settings.name?esc(S.settings.name)+(EN()?', ':'، '):''}${tr('glance')}</p>
 <div class="grid4">${stat(tr('todayTasks'),num(tt.length),'var(--teal)')+stat(tr('doneTasks'),num(S.tasks.filter(x=>x.done).length),'var(--pur)')+stat(tr('studyTime'),fm(m),'var(--navy)')+stat(tr('rate'),num(pct())+(EN()?'%':'٪'),'#e08a3c')}</div>
 <div class="card"><h2>${tr('goalLine',fm(m),fm(S.settings.goal))}</h2><div class="bar"><i style="width:${g}%"></i></div></div>
 <div class="grid2"><div class="card"><h2>${tr('upcoming')}</h2>${up.length?up.map(x=>`<div class="task"><div class="t"><b>${esc(title(x))}</b><small>${esc(sub(x))} • ${x.due||tr('noDue')}</small></div><span class="tag ${x.prio}">${tr(x.prio)}</span></div>`).join(''):`<div class="empty">${tr('noPending')}</div>`}</div>
 <div class="card"><h2>${tr('todaySess')}</h2>${bl.length?bl.map(blk).join(''):`<div class="empty">${tr('noSessToday')}</div>`}</div></div>`},

tasks(){const subs=[...new Set(S.tasks.map(sub))],e=editT&&S.tasks.find(t=>t.id===editT)||{},opt=(v,l,s)=>`<option value="${v}" ${s?'selected':''}>${l}</option>`;
 return`<h1>${tr('tasksT')}</h1><p class="sub">${tr('tasksSub')}</p>
 <div class="card"><form class="f" onsubmit="addTask(event)"><label>${tr('taskName')}<input name="ttl" required maxlength="80" value="${esc(e.id?title(e):'')}"></label>
 <label>${tr('subject')}<input name="sub" list="sl" maxlength="30" placeholder="${tr('subjPh')}" value="${esc(e.id?rawSub(e):'')}"><datalist id="sl">${subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist></label>
 <label>${tr('due')}<input name="due" type="date" value="${e.due||''}"></label>
 <label>${tr('priority')}<select name="prio">${PRS.map(k=>opt(k,tr(k),(e.prio||'med')===k)).join('')}</select></label>
 <div class="row"><button class="pri">${editT?tr('saveEdit'):tr('addTask')}</button>${editT?`<button type="button" class="gh" onclick="editT=null;render()">${tr('cancel')}</button>`:''}</div></form></div>
 <div class="card"><div id="sum"></div><div class="filters"><select onchange="filt.st=this.value;listTasks()">${opt('all',tr('allStatus'))+opt('pending',tr('pending'),filt.st==='pending')+opt('done',tr('doneF'),filt.st==='done')}</select>
 <select onchange="filt.pr=this.value;listTasks()">${opt('all',tr('allPrio'))+PRS.map(k=>opt(k,tr(k),filt.pr===k)).join('')}</select>
 <select onchange="filt.sub=this.value;listTasks()">${opt('all',tr('allSubj'))+subs.map(s=>opt(esc(s),esc(s),filt.sub===s)).join('')}</select></div><div id="tl"></div></div>`},

schedule(){const e=editB&&S.blocks.find(b=>b.id===editB)||{};
 const chips=ORDER.map(d=>`<button class="${d===sd?'on':''}" onclick="sd=${d};render()">${dn(d)}</button>`).join('');
 const col_=d=>S.blocks.filter(b=>b.day===d).sort((a,b)=>a.start.localeCompare(b.start)).map(blk).join('')||'<small style="color:var(--mut)">—</small>';
 return`<h1>${tr('schedT')}</h1><p class="sub">${tr('schedSub')}</p>
 <div class="card"><form class="f" onsubmit="addBlock(event)"><label>${tr('subject')}<input name="sub" required maxlength="30" value="${esc(e.id?rawSub(e):'')}"></label>
 <label>${tr('day')}<select name="day">${ORDER.map(d=>`<option value="${d}" ${(e.day??sd)===d?'selected':''}>${dn(d)}</option>`).join('')}</select></label>
 <label>${tr('start')}<input name="st" type="time" required value="${e.start||'16:00'}"></label><label>${tr('end')}<input name="en" type="time" required value="${e.end||'17:00'}"></label>
 <div class="row"><button class="pri">${editB?tr('saveEdit'):tr('addSess')}</button>${editB?`<button type="button" class="gh" onclick="editB=null;render()">${tr('cancel')}</button>`:''}</div></form><p id="err" style="color:var(--red);margin:8px 0 0"></p></div>
 <div class="row" style="margin-bottom:12px"><button class="sm ${sv==='day'?'pri':''}" onclick="sv='day';render()">${tr('daily')}</button><button class="sm ${sv==='week'?'pri':''}" onclick="sv='week';render()">${tr('weekly')}</button></div>
 ${sv==='day'?`<div class="chips">${chips}</div><div class="card">${col_(sd)}</div>`:`<div class="week">${ORDER.map(d=>`<div class="card col ${d===new Date().getDay()?'today':''}"><h3>${dn(d)}</h3>${col_(d)}</div>`).join('')}</div>`}`},

timer(){return`<h1>${tr('timerT')}</h1><p class="sub">${tr('timerSub')}</p>
 <div class="card tm"><div class="row" style="justify-content:center"><button id="mf" class="sm" onclick="setMode('focus')">${tr('study')}</button><button id="mb" class="sm" onclick="setMode('break')">${tr('brk')}</button></div>
 <div class="ringw"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="rg" cx="100" cy="100" r="88" fill="none" stroke="var(--teal)" stroke-width="12" stroke-linecap="round" stroke-dasharray="552.9" stroke-dashoffset="0"/></svg>
 <div class="c"><div class="big" id="tt">25:00</div><div id="tl2" style="color:var(--mut)"></div></div></div>
 <div class="row" style="justify-content:center"><button class="pri" id="sb" onclick="startPause()"></button><button class="gh" onclick="resetT()">${tr('resetB')}</button><button class="gh" onclick="tpOpen=!tpOpen;tpMsg='';render()">⏲️ ${tr('editTime')}</button></div>
 ${tpOpen?`<form class="f tp" onsubmit="saveTime(event)"><label>${tr('studyMin')}<input name="fo" type="number" min="1" max="180" required value="${S.settings.focus}"></label><label>${tr('breakMin')}<input name="br" type="number" min="1" max="60" required value="${S.settings.brk}"></label>
 <div class="row"><button class="pri">${tr('save')}</button><button type="button" class="gh" onclick="tpOpen=false;tpMsg='';render()">${tr('cancel')}</button></div>${tpMsg?`<p style="grid-column:1/-1;color:var(--teal);margin:0">${tpMsg}</p>`:''}</form>`:''}
 <p style="color:var(--mut)">${tr('sessDone',num(S.log.filter(l=>l.date===today()).length),fm(minOn(today())))}</p></div>`},

stats(){const w=week(),mins=w.map(d=>Math.round(minOn(dstr(d))/6)/10),dd=w.map(d=>doneOn(dstr(d))),lb=w.map(d=>EN()?EN_DAYS[d.getDay()].slice(0,3):AR_DAYS[d.getDay()]),
 tot=S.log.reduce((a,l)=>a+l.min,0),m=minOn(today()),diff=m-minOn(dstr(off(-1))),gp=Math.min(100,Math.round(m/S.settings.goal*100)||0);
 const bars=(v,u)=>`<div class="bars">${v.map((x,i)=>`<div class="bc"><span>${u(x)}</span><div class="bt"><i class="${i===6?'hl':''}" style="height:${x/Math.max(...v,1)*100}%"></i></div><span>${lb[i]}</span></div>`).join('')}</div>`;
 return`<h1>${tr('statsT')}</h1><p class="sub">${tr('statsSub')}</p>
 <div class="grid4">${stat(tr('totalFocus'),fm(tot),'var(--teal)')+stat(tr('doneTasks'),num(S.tasks.filter(t=>t.done).length),'var(--pur)')+stat(tr('goalPct'),num(gp)+(EN()?'%':'٪'),'#e08a3c')+stat(tr('vsY'),(diff>0?'+':diff<0?'−':'')+fm(Math.abs(diff)),'var(--navy)')}</div>
 <div class="grid2"><div class="card"><h2>${tr('hoursWeek')}</h2>${tot?bars(mins,x=>num(x)):`<div class="empty">${tr('noLog')}</div>`}</div>
 <div class="card"><h2>${tr('tasksDaily')}</h2>${dd.some(Boolean)?bars(dd,x=>num(x)):`<div class="empty">${tr('noDone')}</div>`}</div></div>`},

settings(){const s=S.settings;return`<h1>${tr('setT')}</h1><p class="sub">${tr('setSub')}</p>
 <div class="card"><form class="f" onsubmit="saveSet(event)"><label>${tr('yourName')}<input name="nm" maxlength="30" value="${esc(s.name)}"></label>
 <label>${tr('studyMin')}<input name="fo" type="number" min="1" max="180" required value="${s.focus}"></label><label>${tr('breakMin')}<input name="br" type="number" min="1" max="60" required value="${s.brk}"></label>
 <label>${tr('goalMin')}<input name="go" type="number" min="10" max="1000" required value="${s.goal}"></label><button class="pri">${tr('saveSet')}</button></form><p id="ok" style="color:var(--teal);margin:8px 0 0"></p></div>
 <div class="card"><h2>${tr('langT')}</h2>${langBar()}</div>
 <div class="card"><h2>${tr('demoT')}</h2><div class="row"><button class="gh" onclick="rmDemo()">${tr('rmDemo')}</button><button class="gh" onclick="addDemo()">${tr('addDemo')}</button><button class="gh" onclick="showIntro()">${tr('showIntro')}</button></div></div>`}};

/* ===== 7) المهام ===== */
function addTask(ev){ev.preventDefault();const f=ev.target.elements,o={title:f.ttl.value.trim(),subject:f.sub.value.trim(),due:f.due.value,prio:f.prio.value};if(!o.title)return;
 if(editT){const x=S.tasks.find(t=>t.id===editT);delete x.dk;Object.assign(x,o);editT=null}else S.tasks.unshift(Object.assign({id:uid(),done:false},o));save();render()}
function tog(id){const t=S.tasks.find(x=>x.id===id);t.done=!t.done;t.doneAt=t.done?today():null;save();listTasks()}
function delT(id){S.tasks=S.tasks.filter(t=>t.id!==id);if(editT===id)editT=null;save();render()}
function edT(id){editT=id;render();scrollTo(0,0)}
function listTasks(){const L=S.tasks.filter(t=>(filt.st==='all'||(filt.st==='done')===t.done)&&(filt.pr==='all'||t.prio===filt.pr)&&(filt.sub==='all'||sub(t)===filt.sub)),d=S.tasks.filter(t=>t.done).length;
 $('#sum').innerHTML=`<div class="row" style="justify-content:space-between"><b>${tr('remaining',num(S.tasks.length-d),num(d))}</b><b>${num(pct())}${EN()?'%':'٪'}</b></div><div class="bar"><i style="width:${pct()}%"></i></div>`;
 const g={};L.forEach(t=>(g[sub(t)]=g[sub(t)]||[]).push(t));
 $('#tl').innerHTML=L.length?Object.entries(g).map(([s,l])=>`<div class="grp" style="--c:${col(cn(l[0]))}"><span class="dot"></span>${esc(s)}</div>`+l.map(t=>`<div class="task ${t.done?'dn':''}"><input type="checkbox" aria-label="${tr('checkLbl')}" ${t.done?'checked':''} onchange="tog('${t.id}')"><div class="t"><b>${esc(title(t))}</b><small>${t.due||tr('noDue')}</small></div><span class="tag ${t.prio}">${tr(t.prio)}</span><button class="sm" onclick="edT('${t.id}')">${tr('edit')}</button><button class="sm d" onclick="delT('${t.id}')">${tr('del')}</button></div>`).join('')).join(''):`<div class="empty">${tr(S.tasks.length?'noMatch':'noTasks')}</div>`}

/* ===== 8) الجدول ===== */
const blk=b=>`<div class="blk" style="--c:${col(cn(b))}"><b>${esc(sub(b))}</b><small>${b.start} – ${b.end}</small><div class="row" style="margin-top:6px"><button class="sm" onclick="edB('${b.id}')">${tr('edit')}</button><button class="sm d" onclick="delB('${b.id}')">${tr('del')}</button></div></div>`;
function addBlock(ev){ev.preventDefault();const f=ev.target.elements,o={subject:f.sub.value.trim(),day:+f.day.value,start:f.st.value,end:f.en.value};
 if(o.end<=o.start){$('#err').textContent=tr('timeErr');return}
 if(editB){const x=S.blocks.find(b=>b.id===editB);delete x.dk;Object.assign(x,o);editB=null}else S.blocks.push(Object.assign({id:uid()},o));sd=o.day;save();render()}
function delB(id){S.blocks=S.blocks.filter(b=>b.id!==id);if(editB===id)editB=null;save();render()}
function edB(id){editB=id;render();scrollTo(0,0)}

/* ===== 9) المؤقّت (T.tot = مدة الجلسة الحالية، فلا تتغير فجأة) ===== */
let T={mode:'focus',left:S.settings.focus*60,tot:S.settings.focus*60,run:false,end:0};
const dur=()=>(T.mode==='focus'?S.settings.focus:S.settings.brk)*60;
function applyDur(){const idle=!T.run&&T.left===T.tot;if(idle)T.tot=T.left=dur();return idle}
function startPause(){if(T.run){T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));T.run=false}else{T.end=Date.now()+T.left*1000;T.run=true}upd()}
function resetT(){T.run=false;T.tot=T.left=dur();upd()}
function setMode(m){T.mode=m;resetT()}
function saveTime(ev){ev.preventDefault();const f=ev.target.elements,a=+f.fo.value,b=+f.br.value;if(!(a>=1&&b>=1))return;
 S.settings.focus=a;S.settings.brk=b;const i=applyDur();save();tpMsg=tr(i?'savedNow':'savedLater');render()}
function fin(){beep();if(T.mode==='focus'){S.log.push({id:uid(),date:today(),min:S.settings.focus});save()}
 T.run=false;T.mode=T.mode==='focus'?'break':'focus';T.tot=T.left=dur();render()}
setInterval(()=>{if(!T.run)return;T.left=Math.ceil((T.end-Date.now())/1000);if(T.left<=0)fin();else upd()},300);
function upd(){const e=$('#tt');if(!e)return;e.textContent=pad(Math.floor(T.left/60))+':'+pad(T.left%60);
 $('#rg').style.strokeDashoffset=552.9*(1-T.left/T.tot);$('#rg').style.stroke=T.mode==='focus'?'var(--teal)':'var(--pur)';
 $('#tl2').textContent=tr(T.mode==='focus'?'studyTime':'breakNow');
 $('#sb').textContent=tr(T.run?'pauseB':T.left<T.tot?'resumeB':'startB');
 $('#mf').className='sm '+(T.mode==='focus'?'pri':'');$('#mb').className='sm '+(T.mode==='break'?'pri':'')}
function beep(){try{navigator.vibrate&&navigator.vibrate(250);const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=660;g.gain.value=.12;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.4)}catch(e){}}

/* ===== 10) الإعدادات ===== */
function saveSet(ev){ev.preventDefault();const f=ev.target.elements;Object.assign(S.settings,{name:f.nm.value.trim(),focus:+f.fo.value,brk:+f.br.value,goal:+f.go.value});
 applyDur();save();$('#ok').textContent=tr('savedSet')}
function rmDemo(){['tasks','blocks','log'].forEach(k=>S[k]=S[k].filter(x=>!x.demo));save();render()}
function addDemo(){rmDemo();const d=demo();['tasks','blocks','log'].forEach(k=>S[k]=S[k].concat(d[k]));save();render()}

render();
</script>
